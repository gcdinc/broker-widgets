name: BrokerWidgets
options:
  bundleIdPrefix: com.gcd
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: 4
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  BrokerWidgets:
    type: application
    platform: macOS
    sources:
      - path: BrokerWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gcd.BrokerWidgets
        PRODUCT_NAME: BrokerWidgets
        INFOPLIST_FILE: BrokerWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: BrokerWidgets/BrokerWidgets.entitlements
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Broker Widgets
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: BrokerWidgetsWidgets
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - BrokerWidgetsTests

  BrokerWidgetsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrokerWidgetsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gcd.BrokerWidgets.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: BrokerWidgets

  BrokerWidgetsWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: BrokerWidgetsWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gcd.BrokerWidgets.widgets
        PRODUCT_NAME: BrokerWidgetsWidgets
        INFOPLIST_FILE: BrokerWidgetsWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: BrokerWidgetsWidgets/BrokerWidgetsWidgets.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: Broker Widgets
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: 4
        SWIFT_INSTALL_OBJC_HEADER: NO

schemes:
  BrokerWidgets:
    build:
      targets:
        BrokerWidgets: all
        BrokerWidgetsWidgets: all
    run:
      config: Debug
      executable: BrokerWidgets
    test:
      config: Debug
      targets:
        - BrokerWidgetsTests
